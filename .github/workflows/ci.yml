name: Flow CI

# Prototype 01 CI (contract §7/P7).
#
# Scope: regenerate the Xcode project, build for a simulator and run the unit +
# UI tests. Device-level validation (real touch feel, Apple Pencil, GPU pass
# timings, 10-minute device runs) is NOT covered here and must not be inferred
# from a green run — see docs/PERFORMANCE.md and docs/PROGRESS.md.
#
# The job prints the ACTUAL xcodebuild version. If the runner does not provide
# the Xcode required by project.yml, the failure is reported as an environment
# limitation instead of being silently worked around with a Beta toolchain.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: xcodegen / build / test (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Probe Xcode
        run: |
          set -o pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          set -o pipefail
          command -v brew || { echo "Homebrew missing on runner"; exit 1; }
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Regenerate project
        run: |
          set -o pipefail
          xcodegen generate --spec project.yml
          xcodebuild -list -project Flow.xcodeproj

      - name: Resolve simulator
        id: sim
        run: |
          set -o pipefail
          # Prefer an iPhone simulator, else take the first available device.
          UDID=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone .*\([0-9A-F-]+\) *\(" \
            | grep -oE "[0-9A-F]{8}(-[0-9A-F]+)+" | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available \
              | grep -oE "[0-9A-F]{8}(-[0-9A-F]+)+" | head -1)
          fi
          if [ -z "$UDID" ]; then
            echo "No simulator available on this runner"; exit 1
          fi
          echo "using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          mkdir -p ci
          xcodebuild -project Flow.xcodeproj -scheme Flow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ci/build-simulator.log

      - name: Test (Debug, simulator)
        run: |
          set -o pipefail
          mkdir -p ci
          xcodebuild -project Flow.xcodeproj -scheme Flow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "ci/Flow-result.xcresult" \
            test 2>&1 | tee ci/test-simulator.log

      - name: Upload logs (retention 3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            ci/
          retention-days: 3
          if-no-files-found: warn

      - name: Strict gate
        if: always()
        run: |
          grep -qE "BUILD SUCCEEDED" ci/build-simulator.log || { echo "build did not succeed"; exit 1; }
          grep -qE "TEST SUCCEEDED" ci/test-simulator.log || { echo "tests did not succeed"; exit 1; }
          echo "CI scope passed: regenerate + build + test on the simulator"

  scope-note:
    runs-on: ubuntu-latest
    steps:
      - name: State CI coverage limits
        run: |
          echo "Not covered by CI (requires hardware):"
          echo "  - real multi-touch feel and Apple Pencil pressure/tilt"
          echo "  - GPU pass timings, thermals, 120 Hz behaviour"
          echo "  - 10-minute device stability runs"
          echo "See docs/PERFORMANCE.md and docs/PROGRESS.md."
